name: shopcore-flyway-lab

services:
  postgres:
    image: postgres:17
    container_name: shopcore-flyway-lab-pg
    environment:
      POSTGRES_DB: shopcore_flyway_lab
      POSTGRES_USER: flyway_lab
      # Disposable local lab only; never reuse this password elsewhere.
      POSTGRES_PASSWORD: lab_only_change_me
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyway_lab -d shopcore_flyway_lab"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
    name: shopcore_flyway_lab_pg17
